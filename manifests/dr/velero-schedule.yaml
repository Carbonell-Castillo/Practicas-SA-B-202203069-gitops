apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: sa-p9-hourly
  namespace: velero
  labels:
    app.kubernetes.io/part-of: sa-platform
spec:
  schedule: "0 * * * *"
  useOwnerReferencesInBackup: false
  template:
    includedNamespaces: [sa-p9-prod]
    storageLocation: default
    snapshotVolumes: true
    defaultVolumesToFsBackup: true
    ttl: 168h0m0s
