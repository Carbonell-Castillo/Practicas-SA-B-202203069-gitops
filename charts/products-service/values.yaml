replicaCount: 2

secretName: products-runtime

image:
  repository: ghcr.io/carbonell-castillo/products-service
  tag: "1.0.0"

service:
  port: 4002
  targetPort: 4002

health:
  path: /health

env:
  LOG_LEVEL: info
  OTEL_SERVICE_NAME: products-service
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observabilidad.svc:4318
  OTEL_PROPAGATORS: tracecontext,baggage
  PORT: "4002"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
