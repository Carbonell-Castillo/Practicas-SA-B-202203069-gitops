{{- $name := .Chart.Name -}}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ $name }}-health
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  metrics:
    - name: candidate-error-rate
      interval: 15s
      count: 4
      failureLimit: 1
      successCondition: result[0] < 0.05
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.observabilidad.svc:9090
          query: |
            ((sum(rate(http_server_requests_total{service="orders-service-canary",status_code=~"5.."}[1m])) or vector(0))
            / clamp_min((sum(rate(http_server_requests_total{service="orders-service-canary"}[1m])) or vector(0)), 0.001))
    - name: candidate-p95-latency
      interval: 15s
      count: 4
      failureLimit: 1
      successCondition: result[0] < 0.75
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.observabilidad.svc:9090
          query: |
            histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{service="orders-service-canary"}[1m]))) or vector(0)
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: sa-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: sa-platform
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  strategy:
    canary:
      stableService: {{ $name }}-stable
      canaryService: {{ $name }}-canary
      maxSurge: "25%"
      maxUnavailable: 1
      steps:
        - setWeight: 10
        - analysis:
            templates:
              - templateName: {{ $name }}-health
        - pause: {duration: 30s}
        - setWeight: 25
        - analysis:
            templates:
              - templateName: {{ $name }}-health
        - pause: {duration: 60s}
        - setWeight: 50
        - analysis:
            templates:
              - templateName: {{ $name }}-health
        - pause: {duration: 120s}
        - setWeight: 100
        - analysis:
            templates:
              - templateName: {{ $name }}-health
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: sa-platform
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ $name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.health.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.health.path }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
{{ toYaml .Values.resources | indent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          env:
{{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-stable
  labels:
    observability.p10/enabled: "true"
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: stable
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-canary
  labels:
    observability.p10/enabled: "true"
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: canary
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
