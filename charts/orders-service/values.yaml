replicaCount: 2

secretName: orders-runtime

image:
  repository: ghcr.io/carbonell-castillo/orders-service
  tag: "1.0.0"

service:
  port: 4003
  targetPort: 4003

health:
  path: /api/health

env:
  LOG_LEVEL: info
  OTEL_SERVICE_NAME: orders-service
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observabilidad.svc:4318
  OTEL_PROPAGATORS: tracecontext,baggage
  P10_DELAY_MS: "0"
  PORT: "4003"
  PRODUCTS_SERVICE_URL: http://products-service-stable:4002/graphql

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
