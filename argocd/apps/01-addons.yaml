apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-16"
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 12.2.0
    helm:
      releaseName: velero
      values: |
        initContainers:
          - name: velero-plugin-for-gcp
            image: velero/velero-plugin-for-gcp:v1.14.4
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - {mountPath: /target, name: plugins}
        credentials:
          useSecret: false
        serviceAccount:
          server:
            name: velero
            annotations:
              iam.gke.io/gcp-service-account: p9-velero@sa-p9-202203069.iam.gserviceaccount.com
        configuration:
          backupStorageLocation:
            - name: default
              provider: gcp
              bucket: sa-p9-202203069-velero
              default: true
              config:
                serviceAccount: p9-velero@sa-p9-202203069.iam.gserviceaccount.com
          volumeSnapshotLocation:
            - name: default
              provider: gcp
              config:
                project: sa-p9-202203069
                snapshotLocation: us-central1
        deployNodeAgent: true
        snapshotsEnabled: true
        backupsEnabled: true
  destination: {server: https://kubernetes.default.svc, namespace: velero}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=false, ServerSideApply=true]
